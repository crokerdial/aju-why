<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이톡톡 - 하브루타 & 체험 코치</title>
  <style>
    /* 전체 배경 및 컨테이너 */
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background-color: #f4f6f8; /* 대회용으로 조금 더 신뢰감 있는 톤으로 변경 */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    #chat-container {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    /* 상단 헤더 */
    #header {
      padding: 15px 20px;
      background-color: #ffcc00;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
    }
    #delete-btn {
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    /* 연령 선택 탭 디자인 */
    #age-tabs {
      display: flex;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #d49a00;
      border-bottom: 3px solid #ffcc00;
      background-color: #fffaf0;
    }

    /* 채팅창 영역 */
    #chat-history {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #fcfdfe;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message { padding: 14px 18px; border-radius: 15px; font-size: 15px; line-height: 1.6; max-width: 85%; word-break: break-all; }
    .user { align-self: flex-end; background-color: #ffcc00; color: #333; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background-color: #f1f3f5; color: #333; border-bottom-left-radius: 2px; }
    
    /* 🆕 체험 장소 추천 박스 스타일 */
    .place-box {
      margin-top: 15px;
      padding: 12px;
      background-color: #e6f7ff;
      border: 1px solid #91d5ff;
      border-radius: 10px;
      font-size: 13.5px;
      color: #0056b3;
      line-height: 1.5;
    }
    
    /* 입력창 영역 */
    #input-area {
      padding: 15px;
      display: flex;
      background: white;
      border-top: 1px solid #eee;
    }
    #user-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }
    #user-input:focus { border-color: #ffcc00; }
    #send-btn {
      margin-left: 10px;
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header">
    <span>💡 아이톡톡 (하브루타 & 체험 코치)</span>
    <button id="delete-btn" onclick="clearHistory()">기록 삭제</button>
  </div>
  
  <div id="age-tabs">
    <button class="tab-btn active" onclick="changeAge('4~5세(누리과정)', this)">4~5세</button>
    <button class="tab-btn" onclick="changeAge('6~7세(누리과정)', this)">6~7세</button>
    <button class="tab-btn" onclick="changeAge('8~10세(초등저학년)', this)">8~10세</button>
  </div>
  
  <div id="chat-history">
    <div class="message ai">안녕하세요! 연령별 하브루타 대화와 동네 체험 인프라를 연결해주는 코치입니다. 오늘 아이가 어떤 질문을 했나요? 😊</div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="예: 비행기는 어떻게 하늘을 날아?" onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">전송</button>
  </div>
</div>

<script>
  let chatHistory = [];
  const chatHistoryDiv = document.getElementById('chat-history');
  let currentAge = '4~5세(누리과정)';

  function renderMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.innerHTML = text;
    chatHistoryDiv.appendChild(msgDiv);
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
  }

  function clearHistory() {
    if(confirm("대화 기록을 지우고 새로 시작할까요?")) {
      chatHistory = [];
      chatHistoryDiv.innerHTML = `<div class="message ai">기록이 삭제되었습니다. <strong>${currentAge}</strong> 아이와의 새로운 대화를 시작해요!</div>`;
    }
  }

  function changeAge(age, btnElement) {
    currentAge = age;
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => tab.classList.remove('active'));
    btnElement.classList.add('active');
    renderMessage(`설정이 변경되었습니다. <strong>${currentAge}</strong> 수준에 맞춘 하브루타 대화와 맞춤형 체험 장소를 추천해 드릴게요! ✨`, 'ai');
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    renderMessage(text, 'user');
    chatHistory.push({ "role": "user", "parts": [{ "text": text }] });
    input.value = '';

    // 🏆 [대회용 핵심 프롬프트] AI에게 하브루타 + 공공 인프라 추천 역할을 동시에 부여합니다!
    const systemPrompt = `
      너는 ${currentAge} 아이의 부모를 돕는 '하브루타 대화 코치'이자 '공공데이터 기반 지역 체험 추천 전문가'야.
      반드시 JSON 형식으로만 응답해.
      형식:
      {
        "answer": "${currentAge} 아이의 눈높이와 인지 발달 수준에 맞춘 다정한 공감 및 비유적 설명",
        "question": "아이의 사고력을 한 단계 더 넓혀줄 수 있는 꼬리 질문 (1개)",
        "place": "대화 주제와 연관되어 주말에 아이와 방문하기 좋은 '공공시설(국립/시립 박물관, 과학관, 도서관, 생태공원 등)'을 1곳 추천하고 그 이유를 짧게 설명 (예: 이번 주말에는 근처 [OO자연사박물관]에 방문해 보는 건 어떨까요? 공룡 화석을 직접 보면...)"
      }
    `;

    const loadingId = "loading-" + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.className = "message ai";
    loadingDiv.id = loadingId;
    loadingDiv.textContent = "교육과정 연계 답변과 추천 장소를 찾는 중... 🔍";
    chatHistoryDiv.appendChild(loadingDiv);
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

    try {
      const response = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          system_instruction: { parts: [{ text: systemPrompt }] }, 
          contents: chatHistory 
        })
      });

      const data = await response.json();
      document.getElementById(loadingId).remove();
      
      const aiRaw = data.candidates[0].content.parts[0].text;
      const cleanText = aiRaw.replace(/```json/gi, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanText);

      // 🏆 화면 출력부 (답변 + 꼬리질문 + 추천 장소 UI 합성)
      const aiHtml = `
        <div>${parsed.answer}</div>
        <br>
        <div><strong>💡 ${parsed.question}</strong></div>
        <div class="place-box">
          🏛️ <strong>공공 인프라 체험 추천:</strong><br>${parsed.place}
        </div>
      `;
      
      renderMessage(aiHtml, 'ai');
      chatHistory.push({ "role": "model", "parts": [{ "text": aiRaw }] });

    } catch (error) {
      console.error(error);
      document.getElementById(loadingId)?.remove();
      renderMessage("잠시 연결이 원활하지 않아요. 다시 시도해 주세요!", "ai");
    }
  }
</script>

</body>
</html>

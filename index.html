<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이톡톡 브릿지 - 돌봄교실 AI 알림장</title>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background-color: #f0f4f8; 
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    #chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    /* 돌봄교실 컨셉에 맞춘 따뜻한 그린 톤 헤더 */
    #header {
      padding: 15px 20px;
      background-color: #32d078;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
    }
    #delete-btn {
      background: #1e874c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    /* 학년 탭 */
    #age-tabs {
      display: flex;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      font-weight: bold;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #1e874c;
      border-bottom: 3px solid #32d078;
      background-color: #f4fdf8;
    }

    #chat-history {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #fafbfc;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message { padding: 14px 18px; border-radius: 15px; font-size: 15px; line-height: 1.6; max-width: 85%; word-break: break-all; }
    .user { align-self: flex-end; background-color: #32d078; color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background-color: #f1f3f5; color: #333; border-bottom-left-radius: 2px; }
    
    /* 💌 부모님 알림장 박스 스타일 (하이라이트) */
    .report-box {
      margin-top: 15px;
      padding: 15px;
      background-color: #fffde7;
      border: 2px solid #ffeb3b;
      border-radius: 12px;
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }
    .report-title {
      font-weight: bold;
      color: #d49a00;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    /* 홈페이지 이동 버튼 스타일 */
    .link-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #007bff;
      color: white !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      transition: background 0.2s;
    }
    .link-btn:hover { background-color: #0056b3; }

    #input-area {
      padding: 15px;
      display: flex;
      background: white;
      border-top: 1px solid #eee;
    }
    #user-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }
    #user-input:focus { border-color: #32d078; }
    #send-btn {
      margin-left: 10px;
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header">
    <span>🌱 아이톡톡 브릿지</span>
    <button id="delete-btn" onclick="clearHistory()">기록 삭제</button>
  </div>
  
  <div id="age-tabs">
    <button class="tab-btn active" onclick="changeAge('초등 1~2학년(돌봄교실)', this)">1~2학년</button>
    <button class="tab-btn" onclick="changeAge('초등 3~4학년(늘봄학교)', this)">3~4학년</button>
    <button class="tab-btn" onclick="changeAge('유아(참고용)', this)">유아</button>
  </div>
  
  <div id="chat-history">
    <div class="message ai">안녕! 나는 돌봄교실 AI 선생님이야. 오늘 학교에서 제일 재밌었던 일이나 궁금했던 게 뭐야? 😃</div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="여기에 대답을 적어주세요..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">전송</button>
  </div>
</div>

<script>
  let chatHistory = [];
  const chatHistoryDiv = document.getElementById('chat-history');
  let currentAge = '초등 1~2학년(돌봄교실)';

  function renderMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.innerHTML = text;
    chatHistoryDiv.appendChild(msgDiv);
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
  }

  function clearHistory() {
    if(confirm("대화 기록을 지우고 새로 시작할까요?")) {
      chatHistory = [];
      chatHistoryDiv.innerHTML = `<div class="message ai">기록이 삭제되었습니다. <strong>${currentAge}</strong> 친구와의 새로운 대화를 시작해요!</div>`;
    }
  }

  function changeAge(age, btnElement) {
    currentAge = age;
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => tab.classList.remove('active'));
    btnElement.classList.add('active');
    renderMessage(`설정이 변경되었습니다. <strong>${currentAge}</strong> 수준에 맞춘 하브루타 대화와 부모님 알림장을 작성해 드릴게요! ✨`, 'ai');
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    renderMessage(text, 'user');
    chatHistory.push({ "role": "user", "parts": [{ "text": text }] });
    input.value = '';

    // 🏆 [핵심 프롬프트] 아이와의 대화 내용과 부모님 알림장을 분리해서 생성!
    const systemPrompt = `
      너는 ${currentAge} 아이가 방과 후 돌봄교실에서 대화하는 'AI 선생님'이야.
      반드시 아래 JSON 형식으로만 응답해.
      
      {
        "replyToChild": "아이의 말에 공감해주고, 사고력을 넓혀주는 꼬리 질문 (대화체)",
        "reportForParent": {
          "keyword": "대화에서 파악한 아이의 현재 관심사 1단어 (예: 별자리)",
          "placeName": "관심사와 연관된 공공 체험 시설명 (예: 국립과천과학관)",
          "placeReason": "이 장소를 부모님께 추천하는 이유 (친절한 알림장 톤으로)",
          "placeUrl": "해당 장소의 공식 홈페이지 주소. 만약 정확한 주소를 모른다면 'https://search.naver.com/search.naver?query=장소명' 형태로 검색 링크를 생성해."
        }
      }
    `;

    const loadingId = "loading-" + Date.now();
    const loadingDiv = document.createElement('div');
    loadingDiv.className = "message ai";
    loadingDiv.id = loadingId;
    loadingDiv.textContent = "알림장과 추천 장소를 검색하는 중... 🔍";
    chatHistoryDiv.appendChild(loadingDiv);
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

    try {
      const response = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          system_instruction: { parts: [{ text: systemPrompt }] }, 
          contents: chatHistory 
        })
      });

      const data = await response.json();
      document.getElementById(loadingId).remove();
      
      const aiRaw = data.candidates[0].content.parts[0].text;
      const cleanText = aiRaw.replace(/```json/gi, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanText);

      // 🏆 화면 출력부: 대화 내용 + 부모님 알림장(노란 박스) + 홈페이지 링크 버튼
      const aiHtml = `
        <div>${parsed.replyToChild}</div>
        
        <div class="report-box">
          <div class="report-title">💌 퇴근길 학부모 알림장 도착!</div>
          <strong>📌 관심 키워드:</strong> ${parsed.reportForParent.keyword}<br>
          <strong>🏛️ 이번 주말 추천 공공시설:</strong> ${parsed.reportForParent.placeName}<br><br>
          <strong>💡 AI 선생님의 한마디:</strong><br>${parsed.reportForParent.placeReason}<br>
          
          <a href="${parsed.reportForParent.placeUrl}" target="_blank" class="link-btn">
             🌐 ${parsed.reportForParent.placeName} 홈페이지/정보 바로가기
          </a>
        </div>
      `;
      
      renderMessage(aiHtml, 'ai');
      chatHistory.push({ "role": "model", "parts": [{ "text": aiRaw }] });

    } catch (error) {
      console.error(error);
      document.getElementById(loadingId)?.remove();
      renderMessage("잠시 연결이 원활하지 않아요. 다시 시도해 주세요!", "ai");
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하브루타 대화 코치</title>
  <style>
    /* 대표님의 원래 디자인: 노란색 테마 */
    body {
      font-family: 'Malgun Gothic', sans-serif;
      background-color: #fff9e6; /* 연한 노란색 배경 */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    /* 상단 헤더 */
    #header {
      padding: 15px 20px;
      background-color: #ffcc00;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    #delete-btn {
      background: #ff4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    /* 채팅창 */
    #chat-history {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #fffdf5;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message { padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.6; max-width: 80%; word-break: break-all; }
    .user { align-self: flex-end; background-color: #ffcc00; color: #333; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background-color: #eeeeee; color: #333; border-bottom-left-radius: 2px; }
    
    /* 입력창 */
    #input-area {
      padding: 15px;
      display: flex;
      background: white;
      border-top: 1px solid #eee;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
    }
    #send-btn {
      margin-left: 10px;
      background: #ffcc00;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header">
    <span>🌟 하브루타 코치</span>
    <button id="delete-btn" onclick="clearHistory()">기록 삭제</button>
  </div>
  
  <div id="chat-history">
    <div class="message ai">안녕! 오늘 아이가 어떤 궁금한 점을 물어봤나요? 😊</div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="아이가 한 질문을 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">전송</button>
  </div>
</div>

<script>
  let chatHistory = [];
  const chatHistoryDiv = document.getElementById('chat-history');

  // 메시지 화면 표시 함수
  function renderMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.innerHTML = text;
    chatHistoryDiv.appendChild(msgDiv);
    chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
  }

  // 기록 삭제 기능
  function clearHistory() {
    if(confirm("대화 기록을 모두 삭제할까요?")) {
      chatHistory = [];
      chatHistoryDiv.innerHTML = '<div class="message ai">기록이 삭제되었습니다. 새로운 대화를 시작해요! 😊</div>';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    renderMessage(text, 'user');
    chatHistory.push({ "role": "user", "parts": [{ "text": text }] });
    input.value = '';

    const systemPrompt = `너는 4~5세 아이 부모를 돕는 '하브루타 대화 코치'야. 반드시 JSON으로만 응답해. 형식: { "answer": "공감과 비유 설명", "question": "아이에게 던질 질문" }`;

    try {
      const response = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          system_instruction: { parts: [{ text: systemPrompt }] }, 
          contents: chatHistory 
        })
      });

      const data = await response.json();
      
      // AI 답변 추출 및 마크다운 청소 (핵심 로직)
      const aiRaw = data.candidates[0].content.parts[0].text;
      const cleanText = aiRaw.replace(/```json/gi, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(cleanText);

      // 화면 출력 (답변 + 꼬리질문)
      renderMessage(parsed.answer + "<br><br><strong>💡 " + parsed.question + "</strong>", 'ai');
      
      // 대화 기록 저장
      chatHistory.push({ "role": "model", "parts": [{ "text": aiRaw }] });

    } catch (error) {
      console.error(error);
      renderMessage("잠시 연결이 원활하지 않아요. 다시 시도해 주세요!", "ai");
    }
  }
</script>

</body>
</html>
